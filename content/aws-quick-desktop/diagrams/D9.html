<!-- caption: Four separate steps. Publishing does not share, and sharing never skips publishing. -->
<ol class="gq-stones">
  <li><b>Draft</b><span>Edit freely. Nothing live changes.</span></li>
  <li><b>Try it</b><span>Test with right, rephrased and wrong requests.</span></li>
  <li><b>Publish</b><span>Replaces the live version for everyone who has it.</span></li>
  <li><b>Share</b><span>Choose people, groups or the whole account.</span></li>
</ol>
